# Norwegian text-to-speech for VG Generator, via Piper (Wyoming protocol).
# The Node backend connects to this over TCP (default 127.0.0.1:10200) and
# streams the synthesized WAV on to the browser.
#
#   docker compose up -d piper     # start (first run downloads the voice)
#   docker compose logs -f piper   # watch
#   docker compose down            # stop
#
# Voice: no_NO-talesyntese-medium is the Norwegian Piper voice. To change it,
# update the --voice below AND TTS_VOICE in .env so they match. Browse voices at
# https://huggingface.co/rhasspy/piper-voices (see the no/ folder).
services:
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: vg-piper
    command: --voice no_NO-talesyntese-medium
    ports:
      - '10200:10200'
    volumes:
      - piper-data:/data
    restart: unless-stopped

volumes:
  piper-data:
